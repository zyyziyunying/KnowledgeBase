<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
<title id="title">从确认价值到考虑购买</title><desc id="desc">三个判断：得到可信的基础帮助；出现付费可满足的进一步需要；比较价格和条件。箭头表示概念关系，不是固定行为顺序。</desc>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}line,path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#7D8D99"/></marker></defs>
<rect width="1000" height="630" rx="18" fill="#F7FAFC"/>
<text x="40" y="56" font-size="32" fill="#19364A" font-weight="600">从确认价值到考虑购买</text>
<text x="40" y="96" font-size="22" fill="#536978" font-weight="400">“它有用”之后，还要理解“多买的部分对我有什么用”</text>
<rect x="40" y="125" width="920" height="120" rx="14" fill="#EDF4FC" stroke="#EDF4FC"/>
<text x="64" y="163" font-size="25" fill="#2563A6" font-weight="600">01  确认基础价值</text>
<text x="64" y="209" font-size="23" fill="#19364A" font-weight="400">文件存进去了，也顺利取回</text>
<text x="535" y="202" font-size="23" fill="#2563A6" font-weight="400">“我知道它能帮到我。”</text>
<line x1="500" y1="249" x2="500" y2="268" stroke="#7D8D99" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="273" width="920" height="120" rx="14" fill="#EAF6F2" stroke="#EAF6F2"/>
<text x="64" y="311" font-size="25" fill="#147B68" font-weight="600">02  看见付费改善</text>
<text x="64" y="357" font-size="23" fill="#19364A" font-weight="400">想搬入更多资料，现有容量不够</text>
<text x="535" y="350" font-size="23" fill="#147B68" font-weight="400">“额外空间能满足我的需要。”</text>
<line x1="500" y1="397" x2="500" y2="416" stroke="#7D8D99" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="421" width="920" height="120" rx="14" fill="#FFF6E8" stroke="#FFF6E8"/>
<text x="64" y="459" font-size="25" fill="#98601C" font-weight="600">03  评估交易条件</text>
<text x="64" y="505" font-size="23" fill="#19364A" font-weight="400">比较价格、替代办法和购买承诺</text>
<text x="535" y="498" font-size="23" fill="#98601C" font-weight="400">“这份改善值得我付钱吗？”</text>
<text x="40" y="605" font-size="21" fill="#536978" font-weight="400">理解关系用的示意图；真实判断可以交错发生，也可以决定继续免费。</text>
</svg>
