<text x="40" y="58" font-size="32" fill="#19364A" font-weight="600" text-anchor="start">同样的 100 人，平均日活可以相差 10 倍</text>
<text x="40" y="99" font-size="21" fill="#596F7D" font-weight="400" text-anchor="start">假设一个 30 天月份 · 只改变使用频率，月内去重人数保持 100</text>
