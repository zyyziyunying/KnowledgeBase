<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="626" viewBox="0 0 1000 626" role="img" aria-labelledby="title desc">
<title id="title">同样的 100 人，平均日活可以相差 10 倍</title>
<desc id="desc">假设一个30天月份，始终为同样100名用户。每人使用1天时平均日活约3.3，每人使用10天时约33.3，月活都是100。</desc>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}line,path{stroke-linecap:round;stroke-linejoin:round}</style>
