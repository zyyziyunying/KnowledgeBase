<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">手算一轮前向与反向传播</title><desc id="desc">单样本 x = 2，目标 y = 5；这些参数与后续 |x| 训练的初值分开</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718398"/></marker></defs>
<style>text{font-family:"Hiragino Sans GB",Arial,sans-serif} .title{font-weight:600} path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="860" fill="#F9FBFD"/>
<text x="48" y="57" font-size="34" fill="#17324D" text-anchor="start" font-weight="600">手算一轮前向与反向传播</text>
<text x="48" y="94" font-size="22" fill="#52677D" text-anchor="start" font-weight="400">单样本 x = 2，目标 y = 5；这些参数与后续 |x| 训练的初值分开</text>
<text x="48" y="152" font-size="27" fill="#3569B2" text-anchor="start" font-weight="600">前向：先算预测，再算损失</text>
<rect x="50" y="189" width="195" height="210" rx="16" fill="#EDF3FB" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="147.5" y="232" font-size="27" fill="#3569B2" text-anchor="middle" font-weight="600">输入</text>
<text x="147.5" y="322.0" font-size="25" fill="#17324D" text-anchor="middle" font-weight="400">x = 2</text>
<rect x="333" y="189" width="320" height="210" rx="16" fill="#E7F4EF" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="493.0" y="232" font-size="27" fill="#148273" text-anchor="middle" font-weight="600">隐藏层</text>
<text x="493.0" y="271" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">z₁ = 3，z₂ = −1</text>
<text x="493.0" y="305" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">h₁ = 3，h₂ = 0</text>
<text x="493.0" y="339" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">ReLU 截断负支路</text>
<rect x="741" y="189" width="409" height="210" rx="16" fill="#FFF1E4" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="945.5" y="232" font-size="27" fill="#B76525" text-anchor="middle" font-weight="600">输出与损失</text>
<text x="945.5" y="271" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">ŷ = 1×3 + 2×0 = 3</text>
<text x="945.5" y="305" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">e = 3 − 5 = −2</text>
<text x="945.5" y="339" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">ℓ = (−2)²/2 = 2</text>
<line x1="247" y1="294" x2="326" y2="294" stroke="#718398" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="655" y1="294" x2="734" y2="294" stroke="#718398" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="465" font-size="27" fill="#148273" text-anchor="start" font-weight="600">反向：从损失回传变化率</text>
<rect x="741" y="509" width="409" height="216" rx="16" fill="#FFF1E4" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="945.5" y="552" font-size="25" fill="#B76525" text-anchor="middle" font-weight="600">输出层梯度</text>
<text x="945.5" y="591" font-size="23" fill="#17324D" text-anchor="middle" font-weight="400">∂ℓ/∂ŷ = −2</text>
<text x="945.5" y="625" font-size="23" fill="#17324D" text-anchor="middle" font-weight="400">∂ℓ/∂v₁ = −6</text>
<text x="945.5" y="659" font-size="23" fill="#17324D" text-anchor="middle" font-weight="400">∂ℓ/∂v₂ = 0，∂ℓ/∂c = −2</text>
<rect x="333" y="509" width="320" height="216" rx="16" fill="#E7F4EF" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="493.0" y="552" font-size="25" fill="#148273" text-anchor="middle" font-weight="600">经过 ReLU</text>
<text x="493.0" y="591" font-size="23" fill="#17324D" text-anchor="middle" font-weight="400">∂ℓ/∂h₁ = −2</text>
<text x="493.0" y="625" font-size="23" fill="#17324D" text-anchor="middle" font-weight="400">∂ℓ/∂h₂ = −4</text>
<text x="493.0" y="659" font-size="23" fill="#17324D" text-anchor="middle" font-weight="400">δ₁ = −2，δ₂ = 0</text>
<rect x="50" y="509" width="195" height="216" rx="16" fill="#EDF3FB" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="147.5" y="552" font-size="22" fill="#3569B2" text-anchor="middle" font-weight="600">隐藏层梯度</text>
<text x="147.5" y="591" font-size="21" fill="#17324D" text-anchor="middle" font-weight="400">∂ℓ/∂w₁ = −4</text>
<text x="147.5" y="625" font-size="21" fill="#17324D" text-anchor="middle" font-weight="400">∂ℓ/∂b₁ = −2</text>
<text x="147.5" y="659" font-size="21" fill="#17324D" text-anchor="middle" font-weight="400">第二支路为 0</text>
<line x1="739" y1="617" x2="660" y2="617" stroke="#148273" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="331" y1="617" x2="252" y2="617" stroke="#148273" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="789" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">先算完全部梯度，再更新全部参数；反向传播本身不改参数</text>
<text x="48" y="834" font-size="20" fill="#52677D" text-anchor="start" font-weight="400">ReLU 未激活使第二支路的参数梯度为零；其他样本可能激活这条支路。</text>
</svg>
