<text x="70" y="497.36170212765956" font-size="21" fill="#52677D" text-anchor="end" font-weight="400">2</text>
<line x1="90" y1="398.7234042553191" x2="795" y2="398.7234042553191" stroke="#D9E2EC" stroke-width="1"/>
<text x="70" y="406.7234042553191" font-size="21" fill="#52677D" text-anchor="end" font-weight="400">4</text>
<line x1="90" y1="308.0851063829788" x2="795" y2="308.0851063829788" stroke="#D9E2EC" stroke-width="1"/>
<text x="70" y="316.0851063829788" font-size="21" fill="#52677D" text-anchor="end" font-weight="400">6</text>
<line x1="90" y1="217.44680851063828" x2="795" y2="217.44680851063828" stroke="#D9E2EC" stroke-width="1"/>
<text x="70" y="225.44680851063828" font-size="21" fill="#52677D" text-anchor="end" font-weight="400">8</text>
<text x="90.0" y="611" font-size="21" fill="#52677D" text-anchor="middle" font-weight="400">0</text>
<text x="253.95348837209303" y="611" font-size="21" fill="#52677D" text-anchor="middle" font-weight="400">1</text>
<text x="417.90697674418607" y="611" font-size="21" fill="#52677D" text-anchor="middle" font-weight="400">2</text>
<text x="581.8604651162791" y="611" font-size="21" fill="#52677D" text-anchor="middle" font-weight="400">3</text>
<text x="745.8139534883721" y="611" font-size="21" fill="#52677D" text-anchor="middle" font-weight="400">4</text>
<line x1="90" y1="580" x2="795" y2="580" stroke="#17324D" stroke-width="2"/>
<line x1="90" y1="580" x2="90" y2="154" stroke="#17324D" stroke-width="2"/>
<text x="810" y="588" font-size="24" fill="#17324D" text-anchor="start" font-weight="400">x</text>
<text x="75" y="139" font-size="24" fill="#17324D" text-anchor="start" font-weight="400">y</text>
<line x1="90.0" y1="580.0" x2="745.8139534883721" y2="398.7234042553191" stroke="#3569B2" stroke-width="3"/>
<line x1="90.0" y1="534.6808510638298" x2="745.8139534883721" y2="172.1276595744681" stroke="#148273" stroke-width="3"/>
<circle cx="253.95348837209303" cy="444.0425531914894" r="9" fill="#148273" stroke="white" stroke-width="2"/>
<text x="239.95348837209303" y="426.0425531914894" font-size="23" fill="#17324D" text-anchor="end" font-weight="400">(1, 3)</text>
<circle cx="417.90697674418607" cy="353.40425531914894" r="9" fill="#148273" stroke="white" stroke-width="2"/>
<text x="403.90697674418607" y="335.40425531914894" font-size="23" fill="#17324D" text-anchor="end" font-weight="400">(2, 5)</text>
<circle cx="581.8604651162791" cy="262.7659574468085" r="9" fill="#148273" stroke="white" stroke-width="2"/>
<text x="567.8604651162791" y="244.7659574468085" font-size="23" fill="#17324D" text-anchor="end" font-weight="400">(3, 7)</text>
<circle cx="417.90697674418607" cy="489.36170212765956" r="9" fill="#3569B2" stroke="white" stroke-width="2"/>
<line x1="417.90697674418607" y1="489.36170212765956" x2="417.90697674418607" y2="353.40425531914894" stroke="#B76525" stroke-width="3" stroke-dasharray="7 6"/>
<text x="436.90697674418607" y="425.9148936170213" font-size="23" fill="#B76525" text-anchor="start" font-weight="400">差距 3</text>
<rect x="861" y="166" width="284" height="133" rx="16" fill="#EDF3FB" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="1003.0" y="209" font-size="25" fill="#3569B2" text-anchor="middle" font-weight="600">初始参数</text>
<text x="1003.0" y="248" font-size="22" fill="#17324D" text-anchor="middle" font-weight="400">w = 1，b = 0</text>
<text x="1003.0" y="282" font-size="22" fill="#17324D" text-anchor="middle" font-weight="400">x = 2 → 预测 2</text>
<rect x="861" y="323" width="284" height="133" rx="16" fill="#E7F4EF" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="1003.0" y="366" font-size="25" fill="#148273" text-anchor="middle" font-weight="600">另一组参数</text>
<text x="1003.0" y="405" font-size="22" fill="#17324D" text-anchor="middle" font-weight="400">w = 2，b = 1</text>
<text x="1003.0" y="439" font-size="22" fill="#17324D" text-anchor="middle" font-weight="400">x = 2 → 预测 5</text>
<text x="1003" y="508" font-size="23" fill="#B76525" text-anchor="middle" font-weight="400">这一次的平方损失</text>
<text x="1003" y="552" font-size="28" fill="#B76525" text-anchor="middle" font-weight="600">(2 − 5)² = 9</text>
<text x="96" y="638" font-size="22" fill="#17324D" text-anchor="start" font-weight="400">● 教学数据点     蓝线 y = x     绿线 y = 2x + 1</text>
<text x="48" y="664" font-size="20" fill="#52677D" text-anchor="start" font-weight="400">两条线表示两组参数；没有执行训练实验，三点拟合也不等于泛化良好。</text>
</svg>
