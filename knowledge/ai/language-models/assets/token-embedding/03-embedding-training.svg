<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">Embedding 也能接上训练循环</title>
<desc id="desc">从“我喜欢猫”中取一个预测位置：输入“我喜欢”，目标为“猫”。原创教学示意，不对应实际分词器、训练向量或模型输出。</desc>
<rect width="1200" height="830" fill="#f9fbfd"/>
<text x="50" y="46" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="34" fill="#182b42" text-anchor="start" dominant-baseline="central">Embedding 也能接上训练循环</text>
<text x="50" y="96" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="21" fill="#52657a" text-anchor="start" dominant-baseline="central">从“我喜欢猫”中取一个预测位置：输入“我喜欢”，目标为“猫”</text>
<rect x="60" y="145" width="500" height="72" rx="15" fill="#e8f1fb"/>
<text x="310.0" y="181.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="27" fill="#182b42" text-anchor="middle" dominant-baseline="central">输入：我喜欢</text>
<rect x="640" y="145" width="500" height="72" rx="15" fill="#fff0df"/>
<text x="890.0" y="181.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="27" fill="#182b42" text-anchor="middle" dominant-baseline="central">真实目标：猫</text>
<polyline points="310,217 310,265" fill="none" stroke="#8093a7" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="310.00,265.00 304.50,255.47 315.50,255.47" fill="#8093a7"/>
<polyline points="890,217 890,265" fill="none" stroke="#a65e12" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="890.00,265.00 884.50,255.47 895.50,255.47" fill="#a65e12"/>
<rect x="60" y="265" width="500" height="174" rx="15" fill="#e8f1fb"/>
<text x="310.0" y="309.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">① 前向传播</text>
<text x="310.0" y="352.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">ID → 查出输入向量</text>
<text x="310.0" y="395.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">网络计算下一 Token 的预测</text>
<rect x="640" y="265" width="500" height="174" rx="15" fill="#fff0df"/>
<text x="890.0" y="309.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">② 计算损失</text>
<text x="890.0" y="352.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">预测与目标“猫”比较</text>
<text x="890.0" y="395.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">评估对正确 Token 的预测</text>
<polyline points="560,352 640,352" fill="none" stroke="#8093a7" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="640.00,352.00 630.47,357.50 630.47,346.50" fill="#8093a7"/>
<polyline points="890,439 890,535" fill="none" stroke="#a65e12" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="890.00,535.00 884.50,525.47 895.50,525.47" fill="#a65e12"/>
<rect x="640" y="535" width="500" height="174" rx="15" fill="#fff0df"/>
<text x="890.0" y="579.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">③ 反向传播</text>
<text x="890.0" y="622.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">沿计算过程求梯度</text>
<text x="890.0" y="665.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">参数此时尚未更新</text>
<rect x="60" y="535" width="500" height="174" rx="15" fill="#e5f3eb"/>
<text x="310.0" y="579.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">④ 优化器更新</text>
<text x="310.0" y="622.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">修改可训练的 Embedding 表</text>
<text x="310.0" y="665.0" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="25" fill="#182b42" text-anchor="middle" dominant-baseline="central">以及后续网络参数</text>
<polyline points="640,622 560,622" fill="none" stroke="#27734b" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="560.00,622.00 569.53,616.50 569.53,627.50" fill="#27734b"/>
<polyline points="500,535 500,439" fill="none" stroke="#27734b" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="500.00,439.00 505.50,448.53 494.50,448.53" fill="#27734b"/>
<text x="260" y="488" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="22" fill="#27734b" text-anchor="middle" dominant-baseline="central">下一轮用更新后的参数</text>
<text x="600" y="774" font-family="Hiragino Sans GB, PingFang SC, sans-serif" font-size="24" fill="#52657a" text-anchor="middle" dominant-baseline="central">固定分词器时，Token 与 ID 的映射保持不变</text>
</svg>
