<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">梯度沿计算链传回来</title><desc id="desc">先看一个样本：损失 ℓ = e²/2，残差 e = 预测 − 目标</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718398"/></marker></defs>
<style>text{font-family:"Hiragino Sans GB",Arial,sans-serif} .title{font-weight:600} path,line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="670" fill="#F9FBFD"/>
<text x="48" y="57" font-size="34" fill="#17324D" text-anchor="start" font-weight="600">梯度沿计算链传回来</text>
<text x="48" y="94" font-size="22" fill="#52677D" text-anchor="start" font-weight="400">先看一个样本：损失 ℓ = e²/2，残差 e = 预测 − 目标</text>
<rect x="50" y="180" width="250" height="140" rx="16" fill="white" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="175.0" y="223" font-size="27" fill="#3569B2" text-anchor="middle" font-weight="600">参数与输入</text>
<text x="175.0" y="278.0" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">w、b、x</text>
<rect x="330" y="180" width="250" height="140" rx="16" fill="white" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="455.0" y="223" font-size="27" fill="#3569B2" text-anchor="middle" font-weight="600">预测</text>
<text x="455.0" y="278.0" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">ŷ = w × x + b</text>
<rect x="610" y="180" width="250" height="140" rx="16" fill="white" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="735.0" y="223" font-size="27" fill="#3569B2" text-anchor="middle" font-weight="600">残差</text>
<text x="735.0" y="278.0" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">e = ŷ − y</text>
<rect x="890" y="180" width="250" height="140" rx="16" fill="#E7F4EF" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="1015.0" y="223" font-size="27" fill="#148273" text-anchor="middle" font-weight="600">损失</text>
<text x="1015.0" y="278.0" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">ℓ = e²/2</text>
<line x1="300" y1="250" x2="323" y2="250" stroke="#718398" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="580" y1="250" x2="603" y2="250" stroke="#718398" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="860" y1="250" x2="883" y2="250" stroke="#718398" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="374" font-size="26" fill="#148273" text-anchor="middle" font-weight="600">反向应用链式法则：把沿途的局部导数相乘</text>
<line x1="925" y1="415" x2="295" y2="415" stroke="#148273" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1010" y="405" font-size="23" fill="#148273" text-anchor="middle" font-weight="400">∂ℓ/∂e = e</text>
<text x="740" y="456" font-size="23" fill="#148273" text-anchor="middle" font-weight="400">∂e/∂ŷ = 1</text>
<text x="447" y="456" font-size="23" fill="#148273" text-anchor="middle" font-weight="400">∂ŷ/∂w = x</text>
<rect x="50" y="494" width="530" height="100" rx="16" fill="#EDF3FB" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="315.0" y="537" font-size="24" fill="#3569B2" text-anchor="middle" font-weight="600">权重梯度</text>
<text x="315.0" y="572.0" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">∂ℓ/∂w = e × 1 × x = e × x</text>
<rect x="620" y="494" width="530" height="100" rx="16" fill="#E7F4EF" stroke="#D9E2EC" stroke-width="1.5"/>
<text x="885.0" y="537" font-size="24" fill="#148273" text-anchor="middle" font-weight="600">偏置梯度</text>
<text x="885.0" y="572.0" font-size="24" fill="#17324D" text-anchor="middle" font-weight="400">∂ℓ/∂b = e × 1 × 1 = e</text>
<text x="48" y="644" font-size="20" fill="#52677D" text-anchor="start" font-weight="400">完整训练集的梯度，是这些单样本梯度的平均；标签 y 在本例中固定。</text>
</svg>
